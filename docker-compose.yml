version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monolith/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./monolith/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d football_tournament"]
      interval: 10s
      timeout: 5s
      retries: 5

  monolith:
    build: ./monolith
    ports:
      - "3000:3000"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      DB_HOST:           db
      DB_PORT:           5432
      JWT_SECRET:        ${JWT_SECRET}
      MONOLITH_PORT:     ${MONOLITH_PORT}
    depends_on:
      db:
        condition: service_healthy

  standings-service:
    build: ./standings-service
    ports:
      - "3001:3001"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      DB_HOST:           db
      DB_PORT:           5432
      STANDINGS_PORT:    ${STANDINGS_PORT}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  public-service:
    build: ./public-service
    ports:
      - "3002:3002"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      DB_HOST:           db
      DB_PORT:           5432
      PUBLIC_PORT:       ${PUBLIC_PORT}
      STANDINGS_URL:     http://standings-service:3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - monolith
      - standings-service
      - public-service
    restart: unless-stopped

  frontend:
    build: ./frontend

volumes:
  postgres_data:
