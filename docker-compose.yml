version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB:       ${POSTGRES_DB:-football_tournament}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monolith/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./monolith/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d football_tournament"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  monolith:
    build: ./monolith
    ports:
      - "3000:3000"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB:       ${POSTGRES_DB:-football_tournament}
      DB_HOST:           db
      DB_PORT:           5432
      JWT_SECRET:        ${JWT_SECRET:-changeme_use_a_long_random_string}
      MONOLITH_PORT:     ${MONOLITH_PORT:-3000}
      RABBITMQ_URL:      ${RABBITMQ_URL:-amqp://admin:password@rabbitmq:5672}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  standings-service:
    build: ./standings-service
    ports:
      - "3001:3001"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB:       ${POSTGRES_DB:-football_tournament}
      DB_HOST:           db
      DB_PORT:           5432
      STANDINGS_PORT:    ${STANDINGS_PORT:-3001}
      RABBITMQ_URL:      ${RABBITMQ_URL:-amqp://admin:password@rabbitmq:5672}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  public-service:
    build: ./public-service
    ports:
      - "3002:3002"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB:       ${POSTGRES_DB:-football_tournament}
      DB_HOST:           db
      DB_PORT:           5432
      PUBLIC_PORT:       ${PUBLIC_PORT:-3002}
      STANDINGS_URL:     http://standings-service:3001
      REDIS_URL:         ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL:      ${RABBITMQ_URL:-amqp://admin:password@rabbitmq:5672}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:password@rabbitmq:5672}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/football.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.json:/etc/grafana/provisioning/datasources/prometheus.json
      - ./monitoring/grafana-dashboards-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/football.json
    depends_on:
      - prometheus
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - monolith
      - standings-service
      - public-service
    restart: unless-stopped

  frontend:
    build: ./frontend

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  grafana_data:
